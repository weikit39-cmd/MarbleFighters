<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>弹珠人设计</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&family=Press+Start+2P&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet">
<style>
/* Layout: one pixel-art street. Menu = full-bleed scrolling street with a stacked control column;
   Play = portrait lane field (3 lanes) that fills the screen, HUD floating on top. */
:root{
  color-scheme:dark;
  --bg:#050a1e;
  --panel:#0b1c4a;
  --panel-hi:#14337a;
  --edge:#2f7bff;
  --edge-dim:#1b3f8f;
  --cyan:#43e8ff;
  --gold:#ffd23a;
  --gold-deep:#b86a00;
  --red:#ff4f63;
  --ink:#eaf6ff;
  --mute:#8fb3ee;
  --ink-dark:#3a1500;
  --f-display:"ZCOOL QingKe HuangYou","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-px:"Press Start 2P",ui-monospace,Menlo,monospace;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-weight:700;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- menu ---------- */
#menu{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#bgMenu{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#menu::before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,10,30,0) 0%,rgba(5,10,30,.22) 40%,rgba(5,10,30,.5) 100%)}
.wrap{
  position:relative;z-index:2;margin:0 auto;width:100%;max-width:520px;
  padding-block:clamp(8px,1.6vh,18px) clamp(12px,2vh,22px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:clamp(8px,1.5vh,14px);
  min-height:100%;
}
.logo{position:relative;text-align:center;padding-top:clamp(2px,1vh,10px)}
.logo h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(46px,15vw,76px);
  line-height:1.02;letter-spacing:.03em;isolation:isolate;display:inline-block;
  filter:drop-shadow(0 4px 0 #031033)}
.logo h1 span{position:relative;display:inline-block;color:transparent;-webkit-background-clip:text;background-clip:text}
.logo h1 span::before{content:attr(data-t);position:absolute;left:0;top:0;z-index:-1;color:#0a2a86;
  -webkit-text-stroke:.16em #0a2a86;pointer-events:none}
.l1{background-image:linear-gradient(180deg,#ffffff 0%,#b5f7ff 42%,#36b9ff 100%)}
.l2{background-image:linear-gradient(180deg,#fff7c2 0%,#ffd23a 48%,#ff8a00 100%)}
.l2::before{color:#7a2e00!important;-webkit-text-stroke-color:#7a2e00!important}
.logo .bead{position:absolute;right:max(0px,calc(50% - 250px));top:10%;width:clamp(30px,8vw,44px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#fff 0 9%,#7ff0ff 12%,#1f6bff 55%,#0a2a8a 100%);
  box-shadow:0 0 0 3px #0a2a86,0 0 18px #43e8ffaa}
.sub{margin:4px 0 0;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--f-display);font-size:clamp(15px,4.4vw,19px);letter-spacing:.3em;color:#cfeaff;text-shadow:0 2px 0 #031033}
.sub::before,.sub::after{content:"";height:3px;width:clamp(26px,9vw,52px);background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

.panel{position:relative;border:3px solid var(--edge);border-radius:6px;
  background:linear-gradient(180deg,rgba(18,51,122,.9),rgba(8,22,64,.94));
  box-shadow:0 0 0 2px #031033,inset 0 0 0 2px rgba(67,232,255,.12),0 5px 0 #031033,0 0 22px rgba(47,123,255,.35)}
.tab{position:absolute;left:50%;top:0;transform:translate(-50%,-52%);margin:0;white-space:nowrap;
  padding:1px clamp(18px,6vw,30px);background:#0a1f55;border:3px solid var(--edge);border-radius:4px;
  font-family:var(--f-display);font-weight:400;font-size:clamp(17px,5vw,22px);letter-spacing:.12em;color:#fff;
  box-shadow:0 0 0 2px #031033}
.chip-note{position:absolute;right:10px;top:0;transform:translateY(-50%);font-size:11px;padding:1px 10px;border:2px solid var(--edge-dim);
  background:#0a1f55;color:var(--mute);border-radius:3px}

.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,2vw,10px);padding:clamp(16px,2.8vh,22px) clamp(8px,2.4vw,12px) 6px}
.char{position:relative;border:3px solid var(--edge-dim);border-radius:5px;overflow:hidden;background:#07143a;text-align:center;
  transition:transform .12s,border-color .12s,box-shadow .12s}
.char img{display:block;width:100%;aspect-ratio:1.62;object-fit:cover;object-position:50% 20%}
.char .nm{display:block;padding:3px 2px 4px;font-family:var(--f-display);font-weight:400;font-size:clamp(14px,4vw,18px);letter-spacing:.08em;background:rgba(5,12,40,.88)}
.char .ck{display:none;position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);white-space:nowrap;
  padding:0 10px;font-size:12px;line-height:18px;background:#062a5c;border:2px solid var(--cyan);border-bottom:0;border-radius:4px 4px 0 0;color:#bff6ff}
.char[aria-checked="true"]{border-color:var(--cyan);box-shadow:0 0 0 2px #031033,0 0 16px rgba(67,232,255,.6);transform:translateY(-2px)}
.char[aria-checked="true"] .ck{display:block}
.char[aria-checked="true"] .nm{padding-bottom:20px}
.char[data-id="black"][aria-checked="true"]{border-color:#c28bff;box-shadow:0 0 0 2px #031033,0 0 16px rgba(194,139,255,.6)}
.char[data-id="red"][aria-checked="true"]{border-color:#ff7d70;box-shadow:0 0 0 2px #031033,0 0 16px rgba(255,125,112,.6)}
.char:active{transform:scale(.98)}

.stats{margin:0 clamp(8px,2.4vw,12px) clamp(8px,1.4vh,12px);padding:8px 10px 9px;border:2px solid var(--edge-dim);border-radius:5px;background:rgba(4,12,40,.7)}
.st-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.st-head b{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.08em;color:#fff}
.st-head span{font-size:12px;color:var(--mute);font-weight:500;min-width:0}
.st-row{display:grid;grid-template-columns:3.2em 1fr 1.4em;align-items:center;gap:8px;font-size:14px;line-height:1.4}
.st-row .bars{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.st-row i{display:block;height:9px;background:#142556;border:1px solid #1d3678}
.st-row i.on{border-color:rgba(0,0,0,.45);animation:fillin .35s both}
.st-row.atk i.on{background:#ff4057}.st-row.spd i.on{background:#ffc22e}.st-row.end i.on{background:#2fd8ff}
.st-row b{font-family:var(--f-px);font-size:12px;text-align:right}
@keyframes fillin{from{transform:scaleX(0);opacity:0}to{transform:none;opacity:1}}
.st-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:5px;font-size:12px;color:var(--mute);font-weight:500}
.st-meta em{font-style:normal;color:var(--ink);font-weight:700}

.marbles{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(5px,1.6vw,9px);padding:clamp(16px,2.6vh,22px) clamp(8px,2.4vw,12px) clamp(7px,1.2vh,10px)}
.mb{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 5px;border:3px solid var(--edge-dim);border-radius:5px;background:#07143a;transition:transform .12s}
.mb .orb{width:clamp(30px,9vw,44px);aspect-ratio:1;border-radius:50%;box-shadow:0 0 0 3px #031033}
.mb .lb{font-size:clamp(11px,3.1vw,13px);white-space:nowrap}
.mb .ck{display:none;font-size:11px;color:#bff6ff;line-height:1}
.mb[aria-checked="true"]{border-color:var(--cyan);box-shadow:0 0 0 2px #031033,0 0 14px rgba(67,232,255,.55)}
.mb[aria-checked="true"] .ck{display:block}
.mb[aria-checked="true"] .lb{display:none}
.mb:active{transform:scale(.96)}
.o-blue{background:radial-gradient(circle at 34% 28%,#fff 0 7%,#9af3ff 10%,#2b7bff 52%,#0a2a8a 100%)}
.o-fire{background:radial-gradient(circle at 36% 30%,#fff6b0 0 8%,#ffd034 14%,#ff6a00 52%,#9a1400 100%)}
.o-thunder{background:radial-gradient(circle at 34% 28%,#fff 0 6%,#d9b0ff 12%,#7a3cff 52%,#2a0b6e 100%)}
.o-glass{background:radial-gradient(circle at 34% 28%,#fff 0 7%,#9dfb9d 12%,#25b84e 52%,#06451c 100%)}

.row{display:flex;align-items:center;gap:clamp(8px,3vw,16px);padding:4px 10px;border:3px solid var(--edge);border-radius:6px;
  background:linear-gradient(180deg,rgba(18,51,122,.9),rgba(8,22,64,.94));box-shadow:0 0 0 2px #031033,0 4px 0 #031033}
.row .rl{flex:none;width:3.4em;font-family:var(--f-display);font-weight:400;font-size:clamp(18px,5.2vw,22px);letter-spacing:.1em;color:#fff}
.seg{flex:1;min-width:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.seg button{padding:5px 4px;font-size:clamp(14px,4.2vw,17px);border:2px solid var(--edge-dim);border-radius:4px;background:#0b1a4a;color:#cfe0ff;transition:transform .1s}
.seg button[data-d="hard"]{background:#4a1230;border-color:#8a2646}
.seg button[aria-checked="true"]{color:#fff;background:#0f4cbc;border-color:var(--cyan);box-shadow:0 0 0 2px #031033,0 0 12px rgba(67,232,255,.55)}
.seg button[data-d="hard"][aria-checked="true"]{background:#b21f45;border-color:#ff8aa0;box-shadow:0 0 0 2px #031033,0 0 12px rgba(255,100,130,.55)}
.seg button[aria-checked="true"]::before{content:"✓ "}
.seg button:active{transform:scale(.97)}
.row .ic{flex:none;font-size:20px;margin-left:-6px;color:#fff}

.best{margin:0;text-align:center;font-size:13px;color:var(--mute);font-weight:500;letter-spacing:.06em}
.best b{font-family:var(--f-px);font-weight:400;font-size:12px;color:var(--gold)}
#start{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,18px);
  padding:clamp(8px,1.4vh,14px) 12px;border:4px solid #fff3a0;border-radius:8px;
  background:linear-gradient(180deg,#fff08a 0%,#ffd23a 46%,#ffb000 100%);
  box-shadow:0 0 0 3px #7a3a00,0 6px 0 3px #7a3a00,0 0 26px rgba(255,200,40,.55);
  font-family:var(--f-display);font-size:clamp(28px,8.6vw,40px);letter-spacing:.14em;color:var(--ink-dark);
  text-shadow:0 2px 0 rgba(255,255,255,.35);animation:pulse 1.6s ease-in-out infinite}
#start svg{width:.9em;height:.9em;flex:none}
#start:active{transform:translateY(3px);box-shadow:0 0 0 3px #7a3a00,0 3px 0 3px #7a3a00,0 0 20px rgba(255,200,40,.45)}
@keyframes pulse{50%{box-shadow:0 0 0 3px #7a3a00,0 6px 0 3px #7a3a00,0 0 40px rgba(255,210,60,.9)}}
.hint{margin:0;text-align:center;font-family:var(--f-display);font-size:16px;letter-spacing:.28em;color:#cfeaff;text-shadow:0 2px 0 #031033}

/* ---------- play ---------- */
#play{position:absolute;inset:0;display:flex;justify-content:center;
  background:repeating-linear-gradient(45deg,#060c26 0 14px,#071033 14px 28px)}
.stage{position:relative;height:100%;overflow:hidden;touch-action:none;background:#3d435c;
  box-shadow:0 0 0 3px #031033,0 0 40px rgba(47,123,255,.35)}
#game{position:absolute;left:50%;top:0;transform:translateX(-50%)}
#fg{position:absolute;left:50%;top:0;transform:translateX(-50%);pointer-events:none;z-index:2;image-rendering:auto}
.hud{position:absolute;left:0;right:0;top:8px;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hud-row{display:flex;align-items:stretch;gap:8px;width:100%}
.hud-bar{flex:1;min-width:0;display:flex;align-items:center;gap:0;padding:6px 14px;
  border:3px solid var(--edge);border-radius:6px;background:rgba(6,16,50,.88);box-shadow:0 0 0 2px #031033,0 0 14px rgba(47,123,255,.4)}
.hc{display:flex;align-items:baseline;gap:8px;min-width:0;white-space:nowrap}
.hc:first-child{flex:1}
.hc.lv{flex:none;margin-left:14px;padding-left:16px;border-left:2px solid var(--edge-dim)}
.hc .k{font-size:clamp(13px,3.6vw,16px);color:#d6e8ff}
.hc .v{font-family:var(--f-px);font-weight:400;font-size:clamp(12px,3.4vw,15px);font-variant-numeric:tabular-nums}
#hScore{color:var(--gold)}#hLevel{color:#bff6ff}
.hearts-pill{padding:5px 10px;border:3px solid var(--edge);border-radius:6px;background:rgba(6,16,50,.88);box-shadow:0 0 0 2px #031033}
.hearts{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.hearts svg{width:clamp(17px,5vw,22px);height:auto;shape-rendering:crispEdges}
#pauseBtn{pointer-events:auto;flex:none;width:46px;border:3px solid var(--edge);border-radius:6px;background:rgba(6,16,50,.86);
  box-shadow:0 0 0 2px #031033;display:grid;place-items:center}
#pauseBtn i{display:block;width:5px;height:16px;background:#fff;box-shadow:9px 0 0 #fff;margin-right:9px}
.toast{position:absolute;left:50%;top:22%;z-index:3;transform:translateX(-50%);pointer-events:none;opacity:0;white-space:nowrap;
  font-family:var(--f-display);font-size:clamp(26px,8vw,38px);letter-spacing:.14em;color:#fff;
  text-shadow:0 0 0 #031033,3px 3px 0 #0a2a86,-2px -2px 0 #0a2a86,2px -2px 0 #0a2a86,-2px 2px 0 #0a2a86}
.toast.show{animation:toast 1.3s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.08)}30%{transform:translate(-50%,0) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
.swipe{position:absolute;left:0;right:0;bottom:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-bottom:max(14px,env(safe-area-inset-bottom,0px));transition:opacity .8s}
.swipe.off{opacity:0}
.swipe .bar{display:flex;align-items:center;gap:10px;padding:5px 18px;border:2px solid rgba(67,232,255,.7);border-radius:20px;background:rgba(10,40,100,.55);
  font-family:var(--f-display);font-size:17px;letter-spacing:.2em;color:#e6fbff;animation:nudge 1.4s ease-in-out infinite}
.swipe .bar b{font-weight:400;color:var(--cyan);font-size:20px}
@keyframes nudge{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

.ov{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-left,0px));background:rgba(3,7,24,.74);animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{width:min(100%,360px);padding:22px 18px 18px;text-align:center;border:4px solid var(--edge);border-radius:8px;
  background:linear-gradient(180deg,#143a8a,#08194d);box-shadow:0 0 0 3px #031033,0 8px 0 3px #031033,0 0 34px rgba(47,123,255,.5);animation:rise .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes rise{from{transform:translateY(20px) scale(.92);opacity:0}}
.card h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:42px;letter-spacing:.14em;line-height:1.1;color:#fff;text-shadow:0 3px 0 #031033}
.card.over h2{font-family:var(--f-px);font-size:clamp(22px,7.4vw,30px);letter-spacing:.04em;color:var(--red);line-height:1.3;text-shadow:3px 3px 0 #3a0010}
.card .cn{margin:2px 0 0;font-family:var(--f-display);font-size:18px;letter-spacing:.4em;color:var(--mute)}
.res{margin:16px 0 4px;display:grid;gap:8px;padding:12px;border:2px solid var(--edge-dim);border-radius:6px;background:rgba(3,10,36,.7)}
.res div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px;color:#cfe0ff}
.res b{font-family:var(--f-px);font-weight:400;font-size:14px;color:#fff;font-variant-numeric:tabular-nums}
.res .big b{font-size:clamp(20px,6vw,26px);color:var(--gold)}
.nb{display:inline-block;margin-top:8px;padding:3px 12px;background:var(--gold);color:var(--ink-dark);border-radius:4px;font-size:14px;letter-spacing:.1em;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.btns{display:grid;gap:10px;margin-top:14px}
.b{padding:10px 12px;border:3px solid var(--edge);border-radius:6px;background:#0f4cbc;font-family:var(--f-display);font-size:24px;letter-spacing:.2em;color:#fff;
  box-shadow:0 0 0 2px #031033,0 4px 0 2px #031033}
.b.gold{background:linear-gradient(180deg,#fff08a,#ffb000);border-color:#fff3a0;color:var(--ink-dark)}
.b:active{transform:translateY(3px)}
.b:disabled{opacity:.45;pointer-events:none}

@media (max-height:900px){
  .char img{aspect-ratio:1.75}
  .st-head span{display:none}
  .logo h1{font-size:clamp(40px,12.4vw,60px)}
  .hint{display:none}
  .sub{margin-top:0}
  .stats{padding:6px 10px 7px}
  .st-meta{margin-top:3px}
}
@media (prefers-reduced-motion:reduce){
  #start,.swipe .bar,.nb{animation:none}
  .st-row i.on,.card,.ov{animation:none}
  .toast.show{animation:none;opacity:1}
}
</style>

<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#050a1e}</style>
</head>
<body>
<div id="app">
  <main id="menu" aria-label="弹珠人设计 开始界面">
    <canvas id="bgMenu" aria-hidden="true"></canvas>
    <div class="wrap">
      <header class="logo">
        <h1 aria-label="弹珠人设计"><span class="l1" data-t="弹珠人">弹珠人</span><span class="l2" data-t="设计">设计</span></h1>
        <i class="bead" aria-hidden="true"></i>
        <p class="sub">三线弹珠射击</p>
      </header>

      <section class="panel" aria-labelledby="hChar">
        <h2 class="tab" id="hChar">选择角色</h2>
        <div class="chars" id="chars" role="radiogroup" aria-label="选择角色"></div>
        <div class="stats" id="stats" aria-live="polite"></div>
      </section>

      <section class="panel" aria-labelledby="hMarble">
        <h2 class="tab" id="hMarble">选择弹珠</h2>
        <span class="chip-note">外观选择</span>
        <div class="marbles" id="marbles" role="radiogroup" aria-label="选择弹珠颜色"></div>
      </section>

      <section class="row" aria-label="难度">
        <span class="rl">难度</span>
        <div class="seg" id="diffSeg" role="radiogroup" aria-label="难度">
          <button type="button" role="radio" data-d="easy">简单</button>
          <button type="button" role="radio" data-d="normal">普通</button>
          <button type="button" role="radio" data-d="hard">困难</button>
        </div>
      </section>

      <section class="row" aria-label="音乐">
        <span class="rl">音乐</span><span class="ic" aria-hidden="true">♪</span>
        <div class="seg" id="musicSeg" role="radiogroup" aria-label="音乐开关">
          <button type="button" role="radio" data-v="1">ON</button>
          <button type="button" role="radio" data-v="0">OFF</button>
        </div>
      </section>

      <section class="row" aria-label="音效">
        <span class="rl">音效</span><span class="ic" aria-hidden="true">♫</span>
        <div class="seg" id="sfxSeg" role="radiogroup" aria-label="音效开关">
          <button type="button" role="radio" data-v="1">ON</button>
          <button type="button" role="radio" data-v="0">OFF</button>
        </div>
      </section>

function orbFor(mid,r){

/* ---------- world (street) ---------- */
var PAT = {};
function buildPatterns(ctx){
  var road=mk(64,64), r=road.getContext('2d');
  r.fillStyle='#4b5068'; r.fillRect(0,0,64,64);
  for(var i=0;i<260;i++){
    var x=Math.floor(hash(i*3+1)*64), y=Math.floor(hash(i*3+2)*64), v=hash(i*3+3);
    r.fillStyle = v<.5 ? '#434860' : v<.85 ? '#545a74' : '#3a3f55';
    r.fillRect(x,y,1+(v>.9?1:0),1);
  }
  r.fillStyle='#3d4259'; r.fillRect(0,31,64,1); r.fillRect(0,63,64,1);
  PAT.road=ctx.createPattern(road,'repeat');
  var br=mk(24,12), b=br.getContext('2d');
  b.fillStyle='#a8683a'; b.fillRect(0,0,24,12);
  var cols=['#e0a468','#d4915a','#e8b47a','#cf8a52'];
  [[0,0,11],[12,0,11],[6,6,11],[18,6,5],[0,6,5]].forEach(function(p,i){
    b.fillStyle=cols[i%4]; b.fillRect(p[0],p[1],p[2],5);
    b.fillStyle='rgba(255,255,255,.18)'; b.fillRect(p[0],p[1],p[2],1);
  });
  PAT.brick=ctx.createPattern(br,'repeat');
}
function drawTree(c,cx,cy,r,seed){
  c.fillStyle='rgba(0,0,0,.22)'; c.fillRect(cx-r+2,cy+r-3,r*2-2,4);
  c.fillStyle='#5a3414'; c.fillRect(cx-2,cy+r-5,4,7);
  for(var dy=-r;dy<=r;dy++){
    var w=Math.floor(Math.sqrt(r*r-dy*dy));
    for(var dx=-w;dx<=w;dx++){
      var sh=(dx*.55+dy*.7)/r, n=hash(seed*97+(dx+50)*13+(dy+50)*7);
      c.fillStyle = (Math.sqrt(dx*dx+dy*dy)>r-1.4) ? '#14522a' : sh<-.35 ? '#5fc765' : sh<.25 ? '#33a047' : '#1f7a3a';
      if(n>.9) c.fillStyle='#8be08a';
      c.fillRect(cx+dx,cy+dy,1,1);
    }
  }
  for(var i=0;i<6;i++){
    var a=hash(seed*31+i)*6.28, d=hash(seed*17+i)*(r-3);
    c.fillStyle = i%2 ? '#ffffff' : '#ffd6e8';
    c.fillRect(Math.round(cx+Math.cos(a)*d),Math.round(cy+Math.sin(a)*d),1,1);
  }
}
function drawBush(c,x,y,seed){
  c.fillStyle='#14522a'; c.fillRect(x-7,y-3,14,9);
  c.fillStyle='#2f9a45'; c.fillRect(x-6,y-4,12,8); c.fillRect(x-4,y-6,8,3);
  c.fillStyle='#5fc765'; c.fillRect(x-5,y-4,4,2);
  for(var i=0;i<5;i++){ c.fillStyle=i%2?'#fff':'#ffe14a'; c.fillRect(x-5+Math.floor(hash(seed*5+i)*10),y-4+Math.floor(hash(seed*9+i)*8),1,1); }
}
function drawBench(c,x,y){
  c.fillStyle='#2d1a0a'; c.fillRect(x-4,y-9,9,18);
  c.fillStyle='#b9772f'; c.fillRect(x-3,y-8,7,16);
  c.fillStyle='#8a5320'; for(var i=0;i<4;i++) c.fillRect(x-3,y-5+i*4,7,1);
  c.fillStyle='#d9a257'; c.fillRect(x-3,y-8,1,16);
}
function drawBoard(c,x,y){
  c.fillStyle='#4a2a10'; c.fillRect(x-6,y-9,12,18);
  c.fillStyle='#d9c6a0'; c.fillRect(x-5,y-8,10,16);
  c.fillStyle='#6aa7ff'; c.fillRect(x-4,y-7,4,4); c.fillStyle='#ff7a8a'; c.fillRect(x+1,y-3,3,4); c.fillStyle='#fff'; c.fillRect(x-4,y+1,5,4);
}
function drawWorld(c,L,scroll,y0){
  var W=L.W,H=L.H;
  c.save(); c.beginPath(); c.rect(0,y0,W,H-y0); c.clip();
  var s=Math.floor(scroll);
  c.save(); c.translate(L.roadL, y0+(s%64)-64); c.fillStyle=PAT.road; c.fillRect(0,0,L.roadR-L.roadL,H-y0+64); c.restore();
  c.save(); c.translate(0, y0+(s%12)-12); c.fillStyle=PAT.brick; c.fillRect(0,0,L.roadL,H-y0+12); c.restore();
  c.save(); c.translate(L.roadR, y0+(s%12)-12); c.fillStyle=PAT.brick; c.fillRect(0,0,W-L.roadR,H-y0+12); c.restore();
  c.fillStyle='#d5dbec'; c.fillRect(L.roadL-2,y0,2,H-y0); c.fillRect(L.roadR,y0,2,H-y0);
  c.fillStyle='#262a3e'; c.fillRect(L.roadL,y0,1,H-y0); c.fillRect(L.roadR-1,y0,1,H-y0);
  c.fillStyle='rgba(232,238,255,.85)';
  for(var i=1;i<3;i++){
    var x=Math.round(L.roadL+L.laneW*i)-1;
    for(var y=y0-18+(s%18); y<H; y+=18) c.fillRect(x,y,2,9);
  }
  var P=96, k0=Math.floor((-s-50)/P), k1=Math.floor((H-s+50)/P);
  for(var k=k0;k<=k1;k++){
    for(var side=0;side<2;side++){
      var seed=k*2+side+5000, rr=hash(seed), wy=k*P+Math.floor(hash(seed+77)*60), sy=wy+s;
      var cxp = side===0 ? Math.round(L.roadL*.42) : W-Math.round(L.roadL*.42);
      if(rr<.4) drawTree(c,cxp,sy,Math.max(9,Math.round(L.roadL*.4)),seed);
      else if(rr<.58) drawBush(c,cxp+(side?-2:2),sy,seed);
      else if(rr<.74) drawBench(c,side===0?L.roadL-9:L.roadR+9,sy);
      else if(rr<.84) drawBoard(c,cxp,sy);
    }
  }
  c.restore();
}
function drawMenuScene(c,L,scroll){
  var W=L.W,H=L.H, skyH=Math.floor(H*.3);
  var bands=['#69b9ff','#80c8ff','#9bd6ff','#b6e3ff','#cdeeff'];
  for(var i=0;i<bands.length;i++){ c.fillStyle=bands[i]; c.fillRect(0,Math.floor(skyH*i/bands.length),W,Math.ceil(skyH/bands.length)+1); }
  [[.12,.1,14],[.62,.06,18],[.84,.16,11]].forEach(function(p){
    var cx=Math.round(W*p[0]), cy=Math.round(skyH*p[1]*3), r=p[2];
    c.fillStyle='#fff'; c.fillRect(cx-r,cy,r*2,4); c.fillRect(cx-r+3,cy-3,r*2-8,3); c.fillRect(cx-4,cy-5,9,2);
    c.fillStyle='#dcefff'; c.fillRect(cx-r,cy+3,r*2,1);
  });
  var bx=Math.round(W*.1), bw=W-bx*2, by=skyH-Math.round(skyH*.62);
  c.fillStyle='#8a5a3a'; c.fillRect(bx-2,by-2,bw+4,6);
  c.fillStyle='#e6c9a0'; c.fillRect(bx,by+4,bw,skyH-by-4);
  c.fillStyle='#c9a678'; c.fillRect(bx,by+4,bw,2);
  for(var wy=by+10; wy<skyH-8; wy+=11){
    for(var wx=bx+6; wx<bx+bw-8; wx+=11){
      if(Math.abs(wx-(W/2-3))<12) continue;
      c.fillStyle='#4a3a2a'; c.fillRect(wx,wy,7,8);
      c.fillStyle='#7fb8ff'; c.fillRect(wx+1,wy+1,5,6);
      c.fillStyle='#c9e4ff'; c.fillRect(wx+1,wy+1,2,2);
    }
  }
  var tw=26, tx=Math.round(W/2-tw/2), ty=by-16;
  c.fillStyle='#8a5a3a'; c.fillRect(tx-2,ty-3,tw+4,5);
  c.fillStyle='#d9b88a'; c.fillRect(tx,ty+2,tw,skyH-ty-2);
  c.fillStyle='#fff'; c.fillRect(tx+7,ty+7,12,12); c.fillStyle='#2a2a40'; c.fillRect(tx+12,ty+9,2,5); c.fillRect(tx+12,ty+13,4,2);
  c.fillStyle='#5a3a22'; c.fillRect(Math.round(W/2)-8,skyH-14,16,14); c.fillStyle='#9ed0ff'; c.fillRect(Math.round(W/2)-6,skyH-12,12,12);
  c.fillStyle='#b4bdd6'; c.fillRect(0,skyH-3,W,3);
  drawWorld(c,L,scroll,skyH);
  drawTree(c,Math.round(W*.05),skyH+4,Math.round(W*.13),91);

function fitCanvas(cv,cssW,cssH,minS,div){
  var s=Math.max(minS,Math.round(cssW/div));
  var W=Math.max(60,Math.floor(cssW/s)), H=Math.max(80,Math.floor(cssH/s));
  if(cv.width!==W) cv.width=W; if(cv.height!==H) cv.height=H;
  cv.style.width=(W*s)+'px'; cv.style.height=(H*s)+'px';
  return {W:W,H:H,S:s,css:cssW};
}
function mkLayout(W,H,roadPct){
  var rl=Math.round(W*roadPct), rr=W-rl;
  return {W:W,H:H,roadL:rl,roadR:rr,laneW:(rr-rl)/3};
}

function layoutGame(){

function pickType(lv){
  var t=[['slime',10],['bag',8],['imp',lv>=2?7:0],['can',lv>=3?6:0],['crate',lv>=5?4:0]], sum=0, i;
  for(i=0;i<t.length;i++) sum+=t[i][1];
  var r=Math.random()*sum;
  for(i=0;i<t.length;i++){ r-=t[i][1]; if(r<=0) return t[i][0]; }
  return 'slime';
}
function spawn(){
  var lv=Gm.level, d=DIFFS[S.diff], n=1;
  if(lv>=3 && Math.random()<Math.min(.55,.14+lv*.04)) n=2;
  var lanes=[0,1,2].sort(function(){ return Math.random()-.5; }).slice(0,n);
  lanes.forEach(function(ln){
    if(Gm.enemies.some(function(e){ return e.lane===ln && e.y<26; })) return;
    var ty=pickType(lv), def=ENEMY[ty], hp=def.hp+d.hp+Math.floor((lv-1)/3);
    Gm.enemies.push({type:ty,lane:ln,x:laneX(ln),y:-def.h,hp:hp,maxhp:hp,w:def.w,h:def.h,spd:def.spd,hit:0,ph:Math.random()*4});
  });
}
function burst(x,y,col,n,sp,life){

    var a=Math.random()*6.283, v=sp*(.35+Math.random()*.9);
    Gm.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:0,life:life*(.6+Math.random()*.6),c:Array.isArray(col)?col[i%col.length]:col});
  }
}

  setTimeout(function(){ rb.disabled=hb.disabled=false; },750);

}
function update(dt){
  var g=Gm, d=DIFFS[S.diff], c=g.c;
  g.t+=dt; g.scroll+=dt*(48+g.level*3);
  if(g.t>4.5 && !g.swipeHidden){ g.swipeHidden=true; $('#swipe').classList.add('off'); }
  g.px+=(laneX(g.lane)-g.px)*Math.min(1,dt*c.move);
  if(Math.abs(laneX(g.lane)-g.px)<.4) g.px=laneX(g.lane);
  g.hurt=Math.max(0,g.hurt-dt); g.shake=Math.max(0,g.shake-dt); g.flash=Math.max(0,g.flash-dt); g.muzzle=Math.max(0,g.muzzle-dt);

  // shooting
  g.shoot-=dt;
  while(g.shoot<=0){
    g.shoot+=c.interval;
    g.marbles.push({x:Math.round(g.px),y:L.playerY-Math.round(L.laneW*.44),r:c.r,vy:-270,tr:0});
    g.muzzle=.06; Audio_.sfx('shoot');
  }
  // spawn
  g.spawnT-=dt;
  if(g.spawnT<=0){ spawn(); g.spawnT=Math.max(.42,d.spawn*Math.pow(.93,g.level-1))*(.85+Math.random()*.3); }

  // marbles
  var i,j;
  for(i=g.marbles.length-1;i>=0;i--){
    var m=g.marbles[i]; m.y+=m.vy*dt; m.tr+=dt;
    if(m.tr>.025){ m.tr=0; g.parts.push({x:m.x+(Math.random()<.5?0:(Math.random()<.5?-1:1)),y:m.y+m.r+1,vx:0,vy:20,t:0,life:.22,c:MARBLES[S.marble].trail,s:1}); }
    if(m.y<-8){ g.marbles.splice(i,1); continue; }
    var tgt=null;
    for(j=0;j<g.enemies.length;j++){
      var e=g.enemies[j];
      if(e.y+e.h/2<0) continue;
      if(Math.abs(m.x-e.x)<e.w/2+m.r-1 && m.y-m.r<e.y+e.h/2 && m.y+m.r>e.y-e.h/2){
        if(!tgt || e.y>tgt.y) tgt=e;
      }
    }
    if(tgt){
      tgt.hp-=c.dmg; tgt.hit=.09; g.marbles.splice(i,1);
      burst(m.x,m.y,[MARBLES[S.marble].pal[2],'#fff'],5,55,.28);
      if(tgt.hp<=0){
        var def=ENEMY[tgt.type];
        g.streak++;
        var mult=1+Math.min(1,Math.floor(g.streak/5)*.1);
        var pts=Math.round(def.score*DIFFS[S.diff].mult*mult/10)*10;
        g.score+=pts; g.kills++;
        g.pops.push({x:tgt.x-6,y:tgt.y-4,txt:'+'+pts,t:0});
        burst(tgt.x,tgt.y,[ '#fff','#ffd23a',MARBLES[S.marble].pal[2] ],14,90,.5);
        Audio_.sfx('kill');
        g.enemies.splice(g.enemies.indexOf(tgt),1);
        $('#hScore').textContent=fmt(g.score);
        var nl=1+Math.floor(g.kills/10);
        if(nl>g.level){
          g.level=nl; $('#hLevel').textContent=('0'+nl).slice(-2);
          var t=$('#toast'); t.textContent='难度提升 '+('0'+nl).slice(-2); t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
          Audio_.sfx('level');
        }
      } else Audio_.sfx('hit');
    }
  }
  // enemies
  var sp=d.speed+g.level*2.2;
  for(i=g.enemies.length-1;i>=0;i--){
    var en=g.enemies[i]; en.y+=sp*en.spd*dt; en.hit=Math.max(0,en.hit-dt);
    var hitP = Math.abs(en.x-g.px)<en.w/2+9 && en.y+en.h/2>L.playerY-12;
    if(hitP || en.y-en.h/2>L.playerY+16){
      burst(en.x,Math.min(en.y,L.playerY),['#ff4f63','#ffd23a','#fff'],16,100,.5);
      g.enemies.splice(i,1);
      hurtPlayer();
      if(g.over) return;
    }
  }
  // particles / popups
  for(i=g.parts.length-1;i>=0;i--){
    var p=g.parts[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt;
    if(p.t>p.life) g.parts.splice(i,1);
  }
  for(i=g.pops.length-1;i>=0;i--){ var q=g.pops[i]; q.t+=dt; q.y-=14*dt; if(q.t>.8) g.pops.splice(i,1); }
}
function drawPlayerHQ(sx,sy){
  var g=Gm, f=fc, im=SPR.player[S.char];
  f.setTransform(1,0,0,1,0,0); f.clearRect(0,0,fg.width,fg.height);
  if(!im || !im.complete || !im.naturalWidth) return;
  f.setTransform(DPR*L.S,0,0,DPR*L.S,sx*DPR*L.S,sy*DPR*L.S);
  var blink = g.hurt>0 && Math.floor(g.hurt*14)%2===0;
  if(blink) return;
  var maxd=L.laneW*1.16, k=maxd/Math.max(im.naturalWidth,im.naturalHeight);
  var w=im.naturalWidth*k, h=im.naturalHeight*k, x=g.px, top=L.playerY-h/2;
  f.fillStyle='rgba(0,0,0,.3)'; f.beginPath(); f.ellipse(x,top+h+1.5,w*.38,2.2,0,0,6.283); f.fill();
  var fl=.7+.3*Math.sin(g.t*40);
  [-w*.2,w*.2].forEach(function(o){
    var gr=f.createLinearGradient(0,top+h-2,0,top+h+7*fl);
    gr.addColorStop(0,'rgba(255,240,150,.95)'); gr.addColorStop(.5,'rgba(255,140,30,.8)'); gr.addColorStop(1,'rgba(255,80,20,0)');
    f.fillStyle=gr; f.beginPath(); f.moveTo(x+o-2,top+h-3); f.lineTo(x+o+2,top+h-3); f.lineTo(x+o,top+h+7*fl); f.closePath(); f.fill();
  });
  f.drawImage(im,x-w/2,top,w,h);
  if(g.muzzle>0){
    var pal=MARBLES[S.marble].pal, mx=x, my=top+h*.12, rr=g.c.r*1.7;
    var rg=f.createRadialGradient(mx,my,0,mx,my,rr*2);
    rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(.35,pal[2]); rg.addColorStop(1,'rgba(0,0,0,0)');
    f.globalAlpha=.85; f.fillStyle=rg; f.beginPath(); f.arc(mx,my,rr*2,0,6.283); f.fill(); f.globalAlpha=1;
  }
}
function drawGame(){
  var g=Gm, c=ctx, W=L.W, H=L.H;
  c.save();
  var sx=0, sy=0;
  if(g.shake>0 && !reduceMotion){ sx=Math.round((Math.random()-.5)*5); sy=Math.round((Math.random()-.5)*5); c.translate(sx,sy); }
  c.fillStyle='#3d435c'; c.fillRect(-6,-6,W+12,H+12);
  drawWorld(c,L,g.scroll,0);
  // enemies
  var bob=Math.floor(g.t*5)%2;
  g.enemies.slice().sort(function(a,b){ return a.y-b.y; }).forEach(function(e){
    var im = e.hit>0 ? SPR[e.type+'_f'] : SPR[e.type];
    var ex=Math.round(e.x-im.width/2), ey=Math.round(e.y-im.height/2)+((Math.floor(e.ph+g.t*5)%2)&&e.type!=='crate'?-1:0);
    c.fillStyle='rgba(0,0,0,.25)'; c.fillRect(ex+1,ey+im.height-1,im.width-2,2);
    c.drawImage(im,ex,ey);
    var bw=14, bx=Math.round(e.x-bw/2), by=ey-5;
    c.fillStyle='#14080c'; c.fillRect(bx-1,by-1,bw+2,4);
    c.fillStyle='#4a1018'; c.fillRect(bx,by,bw,2);
    c.fillStyle='#ff3b4e'; c.fillRect(bx,by,Math.max(1,Math.round(bw*e.hp/e.maxhp)),2);
    c.fillStyle='rgba(255,255,255,.45)'; c.fillRect(bx,by,Math.max(1,Math.round(bw*e.hp/e.maxhp)),1);
  });
  // marbles
  g.marbles.forEach(function(m){
    var o=orbFor(S.marble,m.r); c.drawImage(o,Math.round(m.x-o.width/2),Math.round(m.y-o.height/2));
  });
  // particles
  g.parts.forEach(function(p){
    c.globalAlpha=Math.max(0,1-p.t/p.life); c.fillStyle=p.c; var s=p.s||2; c.fillRect(Math.round(p.x),Math.round(p.y),s,s);
  });
  c.globalAlpha=1;
  c.restore();
  drawPlayerHQ(sx,sy);
  c.save();
  // popups
  g.pops.forEach(function(p){ c.globalAlpha=Math.min(1,(.8-p.t)*3); drawText(c,p.txt,Math.round(p.x),Math.round(p.y),'#ffd23a'); });
  c.globalAlpha=1;
  // hurt flash
  if(g.flash>0){ c.fillStyle='rgba(255,40,60,'+(g.flash*(reduceMotion?.5:1.1)).toFixed(2)+')'; c.fillRect(-6,-6,W+12,H+12); }
  c.restore();
}

/* ---------- input ---------- */
var ptr=null;
function shiftLane(dir){ if(!Gm||state!=='play') return; var n=Math.max(0,Math.min(2,Gm.lane+dir)); if(n!==Gm.lane) Gm.lane=n; }
stage.addEventListener('pointerdown',function(e){
  if(state!=='play' || e.target.closest('button')) return;
  ptr={id:e.pointerId,x0:e.clientX,anchor:e.clientX,moved:false};
  try{ stage.setPointerCapture(e.pointerId); }catch(err){}
});
stage.addEventListener('pointermove',function(e){
  if(!ptr||e.pointerId!==ptr.id||state!=='play') return;
  var step=L.laneW*L.S*.55, dx=e.clientX-ptr.anchor;
  while(Math.abs(dx)>step){
    var dir=dx>0?1:-1; shiftLane(dir); ptr.anchor+=dir*step; dx=e.clientX-ptr.anchor; ptr.moved=true;
  }
});
function endPtr(e){
  if(!ptr||e.pointerId!==ptr.id) return;
  if(!ptr.moved && Math.abs(e.clientX-ptr.x0)<10 && state==='play'){
    var rect=cv.getBoundingClientRect(), lx=(e.clientX-rect.left)/L.S;
    var lane=Math.max(0,Math.min(2,Math.floor((lx-L.roadL)/L.laneW)));
    Gm.lane=lane;
  }
  ptr=null;
}
stage.addEventListener('pointerup',endPtr);
stage.addEventListener('pointercancel',function(){ ptr=null; });
window.addEventListener('keydown',function(e){
  var k=e.key;
  if(state==='menu'){ if(k==='Enter'||k===' '){ if(document.activeElement && document.activeElement.tagName==='BUTTON' && document.activeElement.id!=='start') return; e.preventDefault(); startGame(); } return; }
  if(state==='play'){
    if(k==='ArrowLeft'||k==='a'||k==='A'){ shiftLane(-1); e.preventDefault(); }
    else if(k==='ArrowRight'||k==='d'||k==='D'){ shiftLane(1); e.preventDefault(); }
    else if(k==='Escape'||k==='p'||k==='P') setPause(true);
  } else if(state==='pause'){ if(k==='Escape'||k==='p'||k==='P'||k==='Enter') setPause(false); }
  else if(state==='over'){ if((k==='Enter'||k==='r'||k==='R') && !$('#btnRetry').disabled) startGame(); }
});

$('#start').addEventListener('click',startGame);
$('#pauseBtn').addEventListener('click',function(){ setPause(true); });
$('#btnResume').addEventListener('click',function(){ setPause(false); });
$('#btnRestart').addEventListener('click',function(){ startGame(); });
$('#btnHome2').addEventListener('click',goMenu);
$('#btnHome').addEventListener('click',goMenu);
$('#btnRetry').addEventListener('click',startGame);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ if(state==='play') setPause(true); Audio_.suspend(); }
  else { Audio_.resume(); }
});
window.addEventListener('resize',function(){
  if(state==='menu') layoutMenu(); else if(L){ layoutGame(); }
});

/* ---------- main loop ---------- */
var last=performance.now();
function frame(now){
  var dt=Math.min(.05,(now-last)/1000); last=now;
  if(state==='menu'){
    if(!reduceMotion) menuScroll+=dt*22;
    drawMenuScene(menuCtx,menuL,menuScroll);
  } else if(state==='play'){
    update(dt); if(state==='play'||state==='over') drawGame();
  } else if(Gm){
    drawGame();
  }
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
buildSprites();
renderChars(); renderMarbles(); renderSeg(); renderStats();
layoutMenu();
requestAnimationFrame(function(t){ last=t; frame(t); });
})();
</script>
